{
  "services": {
    "kafka1": {
      "image": "confluentinc/cp-kafka:7.9.0",
      "hostname": "kafka1",
      "depends_on": [
        "zookeeper"
      ],
      "environment": {
        "KAFKA_BROKER_ID": 1,
        "KAFKA_ZOOKEEPER_CONNECT": "zookeeper:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka1:29092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": 2,
        "KAFKA_MIN_INSYNC_REPLICAS": 2,
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_DELETE_TOPIC_ENABLE": "true",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka1-data:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "kafka2": {
      "image": "confluentinc/cp-kafka:7.9.0",
      "hostname": "kafka2",
      "depends_on": [
        "zookeeper"
      ],
      "environment": {
        "KAFKA_BROKER_ID": 2,
        "KAFKA_ZOOKEEPER_CONNECT": "zookeeper:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka2:29092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": 2,
        "KAFKA_MIN_INSYNC_REPLICAS": 2,
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_DELETE_TOPIC_ENABLE": "true",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka2-data:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "kafka3": {
      "image": "confluentinc/cp-kafka:7.9.0",
      "hostname": "kafka3",
      "depends_on": [
        "zookeeper"
      ],
      "environment": {
        "KAFKA_BROKER_ID": 3,
        "KAFKA_ZOOKEEPER_CONNECT": "zookeeper:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka3:29092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": 3,
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": 2,
        "KAFKA_MIN_INSYNC_REPLICAS": 2,
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_DELETE_TOPIC_ENABLE": "true",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka3-data:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "kafka-init": {
      "depends_on": {
        "kafka1": {
          "condition": "service_healthy"
        },
        "kafka2": {
          "condition": "service_healthy"
        },
        "kafka3": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "KAFKA_REPLICATION_FACTOR": "3"
      }
    },
    "analytics-service": {
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka1:29092,kafka2:29092,kafka3:29092",
        "KAFKA_REPLICATION_FACTOR": "3"
      }
    },
    "audit-service": {
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka1:29092,kafka2:29092,kafka3:29092",
        "KAFKA_REPLICATION_FACTOR": "3"
      }
    },
    "appointment-service": {
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka1:29092,kafka2:29092,kafka3:29092",
        "KAFKA_REPLICATION_FACTOR": "3"
      }
    },
    "kafka-admin-service": {
      "environment": {
        "KAFKA_BOOTSTRAP_SERVERS": "kafka1:29092,kafka2:29092,kafka3:29092",
        "KAFKA_REPLICATION_FACTOR": "3"
      }
    },
    "kafka-ui": {
      "environment": {
        "KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS": "kafka1:29092,kafka2:29092,kafka3:29092"
      }
    }
  },
  "volumes": {
    "kafka2-data": null,
    "kafka3-data": null
  }
}
