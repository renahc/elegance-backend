# Nombre del servicio
spring.application.name=elegance-appointment-service

# Configuración de MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elegance_appointments}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Azure AD (OAuth2)
azure.activedirectory.issuer-uri=${AZURE_AD_ISSUER_URI:https://sts.windows.net/7607c5a6-994c-4951-92bc-3af0cf3eb713/}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:api://304d54f7-d485-478a-a1ea-0c2f874b0c1f}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${azure.activedirectory.issuer-uri}

# Puerto del servidor (DIFERENTE al user-service)
server.port=8081

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html