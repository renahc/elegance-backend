# Nombre del servicio
spring.application.name=elegance-user-service

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/elegance_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=testpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Azure AD (OAuth2) - ACTUALIZADO
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/7607c5a6-994c-4951-92bc-3af0cf3eb713/v2.0

# Puerto del servidor
server.port=8082

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG