# Nombre del servicio
spring.application.name=elegance-user-service

# Configuración de MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elegance_users}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Azure AD (OAuth2)
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:7607c5a6-994c-4951-92bc-3af0cf3eb713}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:304d54f7-d485-478a-a1ea-0c2f874b0c1f}
azure.activedirectory.issuer-uri=${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/7607c5a6-994c-4951-92bc-3af0cf3eb713/v2.0}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${azure.activedirectory.issuer-uri}

# Puerto del servidor
server.port=8082

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:3.88.12.121}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.connection-timeout=5000ms

# Exchange
rabbitmq.exchange=elegance.domain.exchange

# User Queues
rabbitmq.queue.user.created=elegance.user.created.queue
rabbitmq.dlq.user.created=elegance.user.created.dlq
rabbitmq.queue.user.updated=elegance.user.updated.queue
rabbitmq.dlq.user.updated=elegance.user.updated.dlq
rabbitmq.queue.user.deleted=elegance.user.deleted.queue
rabbitmq.dlq.user.deleted=elegance.user.deleted.dlq

# Stylist Queues
rabbitmq.queue.stylist.created=elegance.stylist.created.queue
rabbitmq.dlq.stylist.created=elegance.stylist.created.dlq
rabbitmq.queue.stylist.updated=elegance.stylist.updated.queue
rabbitmq.dlq.stylist.updated=elegance.stylist.updated.dlq
rabbitmq.queue.stylist.deleted=elegance.stylist.deleted.queue
rabbitmq.dlq.stylist.deleted=elegance.stylist.deleted.dlq
