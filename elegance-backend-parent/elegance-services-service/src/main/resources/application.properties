# Nombre del servicio
spring.application.name=elegance-services-service

# Configuración de MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elegance_services}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Azure AD (OAuth2)
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:7607c5a6-994c-4951-92bc-3af0cf3eb713}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:304d54f7-d485-478a-a1ea-0c2f874b0c1f}
azure.activedirectory.issuer-uri=${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/7607c5a6-994c-4951-92bc-3af0cf3eb713/v2.0}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${azure.activedirectory.issuer-uri}

# Puerto del servidor (DIFERENTE a los otros microservicios: 8084)
server.port=8084

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:3.88.12.121}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

rabbitmq.exchange=elegance.domain.exchange

rabbitmq.queue.service.created=elegance.service.created.queue
rabbitmq.dlq.service.created=elegance.service.created.dlq
rabbitmq.queue.service.updated=elegance.service.updated.queue
rabbitmq.dlq.service.updated=elegance.service.updated.dlq
rabbitmq.queue.service.deleted=elegance.service.deleted.queue
rabbitmq.dlq.service.deleted=elegance.service.deleted.dlq
