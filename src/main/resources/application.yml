server:
  port: 8080

spring:
  application:
    name: salon-backend

  # H2 / MySQL Database configuration for elegancebd
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:elegancebd;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always


  # Security OAuth2 Resource Server for Azure AD / Entra ID JWT validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/ff064edc-07f4-448c-97e1-49da14c085f5/v2.0
          jwk-set-uri: https://login.microsoftonline.com/ff064edc-07f4-448c-97e1-49da14c085f5/discovery/v2.0/keys

# OpenAPI / Swagger UI config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Azure App Registration details
azure:
  activedirectory:
    tenant-id: ff064edc-07f4-448c-97e1-49da14c085f5
    client-id: 413ae20f-d59e-4b81-8864-97d5945f7d5f
    app-id-uri: api://413ae20f-d59e-4b81-8864-97d5945f7d5f

logging:
  level:
    org.springframework.security: INFO
    com.elegance.salon: DEBUG
