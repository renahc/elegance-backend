        "SPRING_RABBITMQ_USERNAME": "${RABBITMQ_USER:-elegance}",
        "SPRING_RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka1:29092",
        "KAFKA_REPLICATION_FACTOR": "${KAFKA_REPLICATION_FACTOR:-1}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI}",
        "AZURE_AD_CLIENT_ID": "${AZURE_AD_CLIENT_ID}",
        "AZURE_AD_JWK_SET_URI": "${AZURE_AD_JWK_SET_URI}",
        "CORS_ALLOWED_ORIGINS": "${CORS_ALLOWED_ORIGINS:-https://localhost:5173}",
        "SPRING_PROFILES_ACTIVE": "${SPRING_PROFILES_ACTIVE:-default}",
