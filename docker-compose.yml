        "MAIL_USERNAME": "${MAIL_USERNAME:-}",
        "MAIL_PASSWORD": "${MAIL_PASSWORD:-}",
        "KAFKA_STATE_DIR": "/tmp/elegance-streams",
        "JAVA_TOOL_OPTIONS": "-Xms64m -Xmx384m",
        "KAFKA_CONCURRENCY": "${KAFKA_CONCURRENCY:-1}"
      },
