name: Elegance Backend CI/CD

on:
  push:
    branches:
      - 'Develop/Microservicios'
  pull_request:
    branches:
      - 'Develop/Microservicios'

jobs:
  # ==========================================
  # JOB 1: VALIDACIÓN Y PRUEBAS (CI)
  # ==========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    # 🌟 MySQL temporal para los tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: elegance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ✅ CORREGIDO: Apunta al mvnw dentro de la carpeta del proyecto padre
      - name: Make mvnw executable
        run: chmod +x ./elegance-backend-parent/mvnw

      - name: Build and Run Tests
        env:
          SPRING_DATASOURCE_URL: ${{ vars.TEST_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.TEST_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        
        # ✅ CORREGIDO: Ejecuta el mvnw desde la carpeta correcta
        run: |
          echo "🚀 Iniciando pruebas de integración con base de datos temporal..."
          cd elegance-backend-parent
          ./mvnw clean verify -DskipTests=false


  # ==========================================
  # JOB 2: BUILD DOCKER, PUSH A ECR Y TERRAFORM
  # ==========================================
  deploy-to-aws:
    name: Build Docker & Deploy with Terraform
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push User Service image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: elegance-user-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd elegance-backend-parent/elegance-user-service
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infra/terraform
        env:
          TF_VAR_ecr_user_service_uri: ${{ env.IMAGE_URI }}
          TF_VAR_db_url: ${{ vars.TEST_DB_URL }}
          TF_VAR_db_username: ${{ vars.TEST_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TEST_DB_PASSWORD }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra/terraform
        env:
          TF_VAR_ecr_user_service_uri: ${{ env.IMAGE_URI }}
          TF_VAR_db_url: ${{ vars.TEST_DB_URL }}
          TF_VAR_db_username: ${{ vars.TEST_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TEST_DB_PASSWORD }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: terraform apply -auto-approve tfplan