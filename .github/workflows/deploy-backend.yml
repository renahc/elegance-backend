name: Elegance Backend CI/CD

on:
  push:
    branches:
      - 'Develop/Backend'
  pull_request:
    branches:
      - 'Develop/!Backend'

jobs:
  # ==========================================
  # JOB 1: VALIDACIÓN Y PRUEBAS (CI)
  # ==========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and Run Tests with Secrets
        env:
          # Inyectamos los secretos como variables de entorno para los tests de integración
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          TEST_AZURE_CLIENT_SECRET: ${{ secrets.TEST_AZURE_CLIENT_SECRET }}
        run: |
          # Ejecutamos clean verify. Si algún test falla, el pipeline se detiene aquí.
          ./mvnw clean verify \
            -Dspring.datasource.password=${{ secrets.TEST_DB_PASSWORD }} \
            -Dtest.azure.client-secret=${{ secrets.TEST_AZURE_CLIENT_SECRET }}

      - name: Upload Test Reports (Opcional, para depuración)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  # ==========================================
  # JOB 2: DESPLIEGUE EN AWS CON TERRAFORM (CD)
  # ==========================================
  deploy-to-aws:
    name: Deploy to AWS via Terraform
    runs-on: ubuntu-latest
    needs: build-and-test # ⚠️ ESTO ES CLAVE: Solo se ejecuta si el Job 1 fue EXITOSO
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Cambia a tu región de AWS

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./infrastructure # Asume que tu código TF está aquí
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infrastructure
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve tfplan