name: Recreate and Deploy Backend Infrastructure

on:
  push:
    branches:
      - feat/ep3-kafka-streaming-20261106
  workflow_dispatch:

concurrency:
  group: elegance-backend-deploy
  cancel-in-progress: false

jobs:
  deploy-to-ec2:
    name: Recreate AWS infrastructure and deploy Spring Boot services
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate restart script syntax
        run: |
          bash -n scripts/restart.sh
          bash -n infra/terraform/scripts/cleanup-project-resources.sh

      - name: Validate required GitHub secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.SPRING_RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          AZURE_AD_ISSUER_URI: ${{ secrets.AZURE_AD_ISSUER_URI }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
            DB_PASSWORD MAIL_USERNAME MAIL_PASSWORD RABBITMQ_PASSWORD \
            RABBITMQ_ERLANG_COOKIE AZURE_AD_ISSUER_URI AZURE_AD_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done
          if [[ "$AZURE_AD_ISSUER_URI" != https://login.microsoftonline.com/*/v2.0 ]]; then
            echo "AZURE_AD_ISSUER_URI must be the Entra ID v2 issuer." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JARs
        working-directory: elegance-backend-parent
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Recreate backend infrastructure with temporary local state
        id: terraform
        working-directory: infra/terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_db_password: ${{ secrets.TEST_DB_PASSWORD }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
          TF_VAR_rabbitmq_password: ${{ secrets.SPRING_RABBITMQ_PASSWORD }}
          TF_VAR_rabbitmq_erlang_cookie: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          TF_VAR_azure_ad_issuer_uri: ${{ secrets.AZURE_AD_ISSUER_URI }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan | jq -e '
            [.resource_changes[]?] as $changes |
            (all($changes[]; (.change.actions | index("delete")) == null and (.change.actions | index("update")) == null)) and
            all(["aws_instance.elegance_ec2", "aws_instance.elegance_rabbitmq_ec2", "aws_apigatewayv2_api.elegance_api"][];
              . as $address | any($changes[]; .address == $address and .change.actions == ["create"]))
          ' \
            >/dev/null
          bash scripts/cleanup-project-resources.sh
          terraform apply -input=false -auto-approve tfplan

          backend_ip="$(terraform output -raw ec2_public_ip)"
          rabbitmq_ip="$(terraform output -raw rabbitmq_public_ip)"
          api_gateway_url="$(terraform output -raw api_gateway_url)"
          private_key_path="$RUNNER_TEMP/elegance_backend.pem"
          terraform output -raw ec2_private_key_pem > "$private_key_path"
          chmod 600 "$private_key_path"

          {
            echo "backend_ip=$backend_ip"
            echo "rabbitmq_ip=$rabbitmq_ip"
            echo "api_gateway_url=$api_gateway_url"
            echo "private_key_path=$private_key_path"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Recreated backend infrastructure"
            echo "- Backend EC2 IP: \`$backend_ip\`"
            echo "- RabbitMQ EC2 IP: \`$rabbitmq_ip\`"
            echo "- API Gateway URL: \`$api_gateway_url\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare application environment and deploy services
        env:
          BACKEND_EC2_HOST: ${{ steps.terraform.outputs.backend_ip }}
          PRIVATE_KEY_PATH: ${{ steps.terraform.outputs.private_key_path }}
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AZURE_AD_ISSUER_URI: ${{ secrets.AZURE_AD_ISSUER_URI }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          SPRING_RABBITMQ_HOST: ${{ steps.terraform.outputs.rabbitmq_ip }}
          SPRING_RABBITMQ_PORT: ${{ vars.SPRING_RABBITMQ_PORT || '5672' }}
          SPRING_RABBITMQ_USERNAME: ${{ vars.SPRING_RABBITMQ_USERNAME || 'admin' }}
          SPRING_RABBITMQ_PASSWORD: ${{ secrets.SPRING_RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 "$PRIVATE_KEY_PATH" ~/.ssh/elegance_backend

          : > /tmp/elegance.env
          for name in DB_PASSWORD MAIL_USERNAME MAIL_PASSWORD AZURE_AD_ISSUER_URI \
            AZURE_AD_CLIENT_ID SPRING_RABBITMQ_HOST SPRING_RABBITMQ_PORT \
            SPRING_RABBITMQ_USERNAME SPRING_RABBITMQ_PASSWORD; do
            printf '%s=%q\n' "$name" "${!name}" >> /tmp/elegance.env
          done
          chmod 600 /tmp/elegance.env

          SSH=(ssh -i ~/.ssh/elegance_backend -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/elegance_backend -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          "${SSH[@]}" "ec2-user@${BACKEND_EC2_HOST}" 'mkdir -p /opt/elegance'
          "${SCP[@]}" /tmp/elegance.env "ec2-user@${BACKEND_EC2_HOST}:/tmp/elegance.env.upload"
          "${SCP[@]}" scripts/restart.sh "ec2-user@${BACKEND_EC2_HOST}:/opt/elegance/restart.sh.new"
          "${SCP[@]}" elegance-backend-parent/elegance-user-service/target/elegance-user-service-1.0.0-SNAPSHOT.jar \
            "ec2-user@${BACKEND_EC2_HOST}:/opt/elegance/elegance-user-service.jar.new"
          "${SCP[@]}" elegance-backend-parent/elegance-appointment-service/target/elegance-appointment-service-1.0.0-SNAPSHOT.jar \
            "ec2-user@${BACKEND_EC2_HOST}:/opt/elegance/elegance-appointment-service.jar.new"
          "${SCP[@]}" elegance-backend-parent/elegance-notification-service/target/elegance-notification-service-1.0.0-SNAPSHOT.jar \
            "ec2-user@${BACKEND_EC2_HOST}:/opt/elegance/elegance-notification-service.jar.new"
          "${SCP[@]}" elegance-backend-parent/elegance-services-service/target/elegance-services-service-1.0.0-SNAPSHOT.jar \
            "ec2-user@${BACKEND_EC2_HOST}:/opt/elegance/elegance-services-service.jar.new"

          "${SSH[@]}" "ec2-user@${BACKEND_EC2_HOST}" '
            set -e
            sudo install -o ec2-user -g ec2-user -m 600 /tmp/elegance.env.upload /opt/elegance/.env.new
            mv /opt/elegance/.env.new /opt/elegance/.env
            mv /opt/elegance/restart.sh.new /opt/elegance/restart.sh
            chmod 700 /opt/elegance/restart.sh
            mv /opt/elegance/elegance-user-service.jar.new /opt/elegance/elegance-user-service.jar
            mv /opt/elegance/elegance-appointment-service.jar.new /opt/elegance/elegance-appointment-service.jar
            mv /opt/elegance/elegance-notification-service.jar.new /opt/elegance/elegance-notification-service.jar
            mv /opt/elegance/elegance-services-service.jar.new /opt/elegance/elegance-services-service.jar
            rm -f /tmp/elegance.env.upload
            bash /opt/elegance/restart.sh
          '
