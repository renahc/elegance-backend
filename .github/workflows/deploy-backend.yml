name: Elegance Backend CI/CD

on:
  push:
    branches:
      - 'Develop/Microservicios'
  pull_request:
    branches:
      - 'Develop/Microservicios'

jobs:
  # ==========================================
  # JOB 1: VALIDACIÓN Y PRUEBAS (CI)
  # ==========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    # 🌟 MySQL temporal para los tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: elegance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ✅ CORREGIDO: Apunta al mvnw dentro de la carpeta del proyecto padre
      - name: Make mvnw executable
        run: chmod +x ./elegance-backend-parent/mvnw

      - name: Build and Run Tests
        env:
          SPRING_DATASOURCE_URL: ${{ vars.TEST_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.TEST_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        
        # ✅ CORREGIDO: Ejecuta el mvnw desde la carpeta correcta
        run: |
          echo "🚀 Iniciando pruebas de integración con base de datos temporal..."
          cd elegance-backend-parent
          ./mvnw clean verify -DskipTests=false



  # ==========================================
  # JOB 2: TERRAFORM EC2 + DESPLIEGUE POR SSH
  # ==========================================
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs with Maven
        run: |
          cd elegance-backend-parent
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Apply (crea o mantiene la EC2)
        working-directory: ./infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.TEST_DB_PASSWORD }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Get EC2 connection data from Terraform outputs
        working-directory: ./infra/terraform
        run: |
          echo "EC2_HOST=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV
          terraform output -raw ec2_private_key_pem > /tmp/key.pem
          chmod 600 /tmp/key.pem

      - name: Wait for EC2 to be ready (Java + MySQL instalados)
        run: |
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/key.pem ec2-user@${{ env.EC2_HOST }} \
              'command -v java && systemctl is-active mysqld && test -d /opt/elegance' > /dev/null 2>&1; then
              echo "✅ EC2 lista"
              exit 0
            fi
            echo "Esperando instancia... ($i/40)"
            sleep 15
          done
          echo "❌ La instancia no terminó de prepararse"
          exit 1

      - name: Create .env file with secrets
        env:
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          printf 'DB_PASSWORD=%s\nMAIL_USERNAME=%s\nMAIL_PASSWORD=%s\n' \
            "$DB_PASSWORD" "$MAIL_USERNAME" "$MAIL_PASSWORD" > /tmp/.env

      - name: Upload JARs, .env y restart.sh a la EC2
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem \
            elegance-backend-parent/elegance-user-service/target/elegance-user-service-*.jar \
            ec2-user@${{ env.EC2_HOST }}:/opt/elegance/elegance-user-service.jar
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem \
            elegance-backend-parent/elegance-appointment-service/target/elegance-appointment-service-*.jar \
            ec2-user@${{ env.EC2_HOST }}:/opt/elegance/elegance-appointment-service.jar
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem \
            elegance-backend-parent/elegance-notification-service/target/elegance-notification-service-*.jar \
            ec2-user@${{ env.EC2_HOST }}:/opt/elegance/elegance-notification-service.jar
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem /tmp/.env ec2-user@${{ env.EC2_HOST }}:/opt/elegance/.env
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem scripts/restart.sh ec2-user@${{ env.EC2_HOST }}:/opt/elegance/restart.sh

      - name: Restart services
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.EC2_HOST }} \
            'chmod 600 /opt/elegance/.env && bash /opt/elegance/restart.sh'