name: Deploy Microservices to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./elegance-backend-parent  # ← CLAVE
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Appointment Service
        run: |
          mvn clean package -DskipTests -pl elegance-appointment-service -am
          docker build -t ${{ secrets.ECR_REGISTRY }}/appointment-service:${{ github.sha }} \
            elegance-appointment-service/
          docker push ${{ secrets.ECR_REGISTRY }}/appointment-service:${{ github.sha }}