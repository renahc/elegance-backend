name: Elegance Backend CI/CD

on:
  push:
    branches:
      - 'Develop/Microservicios'
  pull_request:
    branches:
      - 'Develop/Microservicios'

jobs:
  # ==========================================
  # JOB 1: VALIDACIÓN Y PRUEBAS (CI)
  # ==========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    # 🌟 AQUÍ ESTÁ LA MAGIA: Levanta un MySQL temporal para los tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: elegance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and Run Tests
        env:
          # Inyectamos las variables y secretos en el entorno de Spring Boot
          SPRING_DATASOURCE_URL: ${{ vars.TEST_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.TEST_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          
          SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        
        run: |
          echo "🚀 Iniciando pruebas de integración con base de datos temporal..."
          # clean verify compila y ejecuta todos los tests. Si uno falla, el job falla.
          ./mvnw clean verify -DskipTests=false