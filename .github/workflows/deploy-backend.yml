name: Backend validation and deployment
on:
  push:
    branches: [main, Develop/Microservicios, kafka-ev3]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [test, terraform]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update the existing deployment
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          rsync -az --exclude=.git --exclude=.env --exclude=public --exclude=backups \
            --exclude='**/target' --exclude='**/.terraform' --exclude='**/*.tfstate*' \
            ./ "$SSH_USER@$HOST:/opt/elegance/"
          ssh "$SSH_USER@$HOST" 'ELEGANCE_CLUSTER=true bash /opt/elegance/scripts/deploy-streaming.sh'
