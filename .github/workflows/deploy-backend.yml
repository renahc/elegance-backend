name: Backend validation and deployment
on:
  push:
    branches: feat/ep3-kafka-streaming-20261106
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy validated sources to the configured EC2
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f elegance-backend-parent/pom.xml verify
      - name: Integration with isolated test issuer
        run: |
          cp .env.example .env.integration
          docker compose --env-file .env.integration -f docker-compose.yml -f docker-compose.test.yml -p elegance-integration up -d --build
          ELEGANCE_TEST_ENV=.env.integration python3 scripts/test/integration.py
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file .env.integration -f docker-compose.yml -f docker-compose.test.yml -p elegance-integration logs --tail=60
      - name: Remove isolated test environment
        if: always()
        run: docker compose --env-file .env.integration -f docker-compose.yml -f docker-compose.test.yml -p elegance-integration down -v
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload validated source
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_USER || 'ubuntu' }}
        run: |
          rsync -az --exclude=.git --exclude=.env --exclude='**/target' --exclude='**/.terraform' --exclude='**/*.tfstate*' --exclude='**/*.pem' ./ "$SSH_USER@$HOST:/opt/elegance/"
          ssh "$SSH_USER@$HOST" 'bash /opt/elegance/scripts/deploy-streaming.sh'
